<h2>Student Enrollment Request</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <div class="field">
    <label for="studentName">Student Name</label>
    <input
      id="studentName"
      name="studentName"
      type="text"
      [(ngModel)]="studentName"
      #nameCtrl="ngModel"
      required
      minlength="3">
    <span class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required</span>
    <span class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters</span>
  </div>

  <div class="field">
    <label for="studentEmail">Student Email</label>
    <input
      id="studentEmail"
      name="studentEmail"
      type="email"
      [(ngModel)]="studentEmail"
      #emailCtrl="ngModel"
      required
      email>
    <span class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required</span>
    <span class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">Enter a valid email</span>
  </div>

  <div class="field">
    <label for="courseId">Course ID</label>
    <input
      id="courseId"
      name="courseId"
      type="number"
      [(ngModel)]="courseId"
      #courseIdCtrl="ngModel"
      required>
    <span class="error" *ngIf="courseIdCtrl.touched && courseIdCtrl.errors?.['required']">Course ID is required</span>
  </div>

  <div class="field">
    <label for="preferredSemester">Preferred Semester</label>
    <select
      id="preferredSemester"
      name="preferredSemester"
      [(ngModel)]="preferredSemester"
      required>
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div class="field checkbox-field">
    <label for="agreeToTerms">
      <input
        id="agreeToTerms"
        name="agreeToTerms"
        type="checkbox"
        [(ngModel)]="agreeToTerms"
        required>
      I agree to the terms
    </label>
  </div>

  <div class="actions">
    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    <button type="button" (click)="onReset(enrollForm)">Reset</button>
  </div>

  <div class="success-message" *ngIf="submitted">
    Enrollment request submitted successfully!
  </div>

</form>
