<h2>Course Listing</h2>

<input [(ngModel)]="searchTerm" (ngModelChange)="onSearch()" placeholder="Search courses" />

<p *ngIf="isLoading">Loading courses...</p>
<p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

<ng-container *ngIf="!isLoading && !errorMessage">
  <ng-container *ngIf="filteredCourses.length > 0; else noCourses">
    <app-course-card
      *ngFor="let course of filteredCourses; let i = index; trackBy: trackByCourseId"
      [course]="course"
      (enrollRequested)="onEnroll($event)">
    </app-course-card>
  </ng-container>
  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</ng-container>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
