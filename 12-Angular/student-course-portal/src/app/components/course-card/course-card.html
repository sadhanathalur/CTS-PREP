<div class="card">

  <h3>{{ course.name }}</h3>

  <p><b>ID:</b> {{ course.id }}</p>

  <p><b>Code:</b> {{ course.code }}</p>

  <p><b>Credits:</b> {{ course.credits }}</p>

  <div [ngSwitch]="course.status">

    <p *ngSwitchCase="'Open'">🟢 Open</p>

    <p *ngSwitchCase="'Closed'">🔴 Closed</p>

    <p *ngSwitchDefault>Unknown</p>

  </div>

  <button (click)="enroll()">
    Enroll
  </button>

</div>
