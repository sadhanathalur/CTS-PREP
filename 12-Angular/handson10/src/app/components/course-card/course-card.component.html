<div class="course-card"
     *ngIf="enrolledIds$ | async as enrolledIds"
     [ngClass]="cardClasses(enrolledIds)"
     [ngStyle]="{ 'border-left-color': borderColor }"
     appHighlight="#fff9c4">
  <h3 (click)="viewDetails()">{{ course.name }}</h3>
  <p>Code: {{ course.code }}</p>
  <p>Credits: {{ course.credits | creditLabel }}</p>

  <span class="badge" [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'" class="badge badge--passed">Passed</span>
    <span *ngSwitchCase="'failed'" class="badge badge--failed">Failed</span>
    <span *ngSwitchDefault class="badge badge--pending">Pending</span>
  </span>

  <div class="actions">
    <button (click)="onEnrollClick(enrolledIds)">{{ enrolledIds.includes(course.id) ? 'Unenroll' : 'Enroll' }}</button>
    <button (click)="toggleDetails()">Show Details</button>
  </div>

  <div *ngIf="isExpanded" class="details">
    <p>Additional details for {{ course.name }} go here.</p>
  </div>
</div>
